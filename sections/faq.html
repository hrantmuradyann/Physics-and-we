<!--
  ══════════════════════════════════════════════════════════════════════════
  FAQ PAGE — layout only.
  The questions and answers are NOT here. They are in  data/faq.json .
  ══════════════════════════════════════════════════════════════════════════
-->

<!-- ░░ PAGE TITLE ░░ -->
<header class="page-head">
  <div class="container">
    <p class="eyebrow reveal" data-text="page.eyebrow"></p>
    <h1 class="page-head__title reveal" data-text="page.title"></h1>
    <p class="lead reveal" data-text="page.lead"></p>
  </div>
</header>

<!-- ░░ THE QUESTIONS (click one to open it) ░░ -->
<section class="band">
  <div class="container container--narrow">
    <div class="faq" data-list="questions">
      <template>
        <details class="faq__item reveal">
          <summary class="faq__question" data-text="q"></summary>
          <div class="faq__answer" data-rich="a"></div>
        </details>
      </template>
    </div>
  </div>
</section>

<!-- ░░ CLOSING INVITATION ░░ -->
<section class="cta">
  <div class="container cta__inner reveal">
    <h2 class="cta__title" data-text="cta.title"></h2>
    <p class="cta__text" data-text="cta.text"></p>
    <a class="btn btn--primary btn--lg" data-route="cta.button.route" data-text="cta.button.label"></a>
  </div>
</section>
