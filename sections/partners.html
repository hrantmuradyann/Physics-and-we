<!--
  ══════════════════════════════════════════════════════════════════════════
  PARTNERS PAGE — layout only.
  The words are NOT here. They are in  data/partners.json .
  ══════════════════════════════════════════════════════════════════════════
-->

<!-- ░░ PAGE TITLE ░░ -->
<header class="page-head">
  <div class="container">
    <p class="eyebrow reveal" data-text="page.eyebrow"></p>
    <h1 class="page-head__title reveal" data-text="page.title"></h1>
    <p class="lead reveal" data-text="page.lead"></p>
  </div>
</header>

<!-- ░░ WHO WE WORK WITH ░░ -->
<section class="band">
  <div class="container">
    <div class="grid grid--cards" data-list="partners">
      <template>
        <article class="card card--partner reveal">
          <span class="partner-logo">
            <img data-image="logo" data-alt="name" loading="lazy" decoding="async">
          </span>
          <h3 class="card__title" data-text="name"></h3>
        </article>
      </template>
    </div>
  </div>
</section>

<!-- ░░ A PHOTOGRAPH ░░ -->
<section class="photo-band">
  <div class="container">
    <figure class="photo reveal">
      <img data-image="photo.image" data-alt="photo.alt" loading="lazy" decoding="async">
      <figcaption class="photo__caption" data-text="photo.caption"></figcaption>
     </figure>
  </div>
</section>
